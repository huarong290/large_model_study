server:
  port: 10004
langchain4j:
  # ==========================================
  # 一、本地 Ollama 配置
  # ==========================================
  ollama:
    chat-model:
      base-url: http://localhost:11434
      model-name: deepseek-r1:14b  # 你的常规模型
      temperature: 0.8
      timeout: 60s
    streaming-chat-model:         # 支持流式输出的模型配置
      base-url: http://localhost:11434
      model-name: qwen2.5-coder:14b         # 一个支持流式的模型
      temperature: 0.8
  # OpenAI 配置（云端）
  open-ai:
    chat-model:
      # API 端点
      base-url: http://langchain4j.dev/demo/openai/v1
      #  API Key 从环境变量读取，不要硬编码
      api-key: demo
      model-name: gpt-4o-mini
      temperature: 0.7
      timeout: 60s
      log-requests: true
      log-responses: true
    streaming-chat-model:         # 支持流式输出的模型配置
      base-url: http://langchain4j.dev/demo/openai/v1
      api-key: demo
      model-name: gpt-4o-mini        # 一个支持流式的模型
      temperature: 0.8

logging:
  level:
    dev.langchain4j: DEBUG