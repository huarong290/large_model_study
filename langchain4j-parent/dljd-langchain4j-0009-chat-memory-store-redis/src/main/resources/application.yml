server:
  port: 10008
langchain4j:
  # 本地 Ollama 配置
  ollama:
    chat-model:
      base-url: http://localhost:11434  # Ollama 服务地址
      model-name: deepseek-r1:14b          # 或者你 pull 下来的任何模型，如 qwen2.5
      temperature: 0.8
      timeout: 60s
  # OpenAI 配置（云端）
  open-ai:
    chat-model:
      # DeepSeek API Key 从环境变量读取，不要硬编码
      api-key: sk-d9acf81847274fcfb8cbfe0f20051ffd
      # DeepSeek 的 API 端点
      base-url: https://api.deepseek.com
      # 旧的模型别名 deepseek-chat 和 deepseek-reasoner 将在 2026年7月24日 停止使用 最新的 deepseek-v4-flash 或 deepseek-v4-pro
      model-name: deepseek-v4-flash
      temperature: 0.7
      timeout: 60s
      log-requests: true
      log-responses: true

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:33061/chat_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  # ------------------------------------------------------
  # 2. Redis 哨兵拓扑连接（自动继承主文件的 Lettuce 连接池参数）
  # ------------------------------------------------------
  data:
    redis:
      sentinel:
        master: mymaster          # ⚠️ 必须严格对齐你本地 sentinel.conf 中的集群主节点别名
        nodes:
          - 127.0.0.1:26379
          - 127.0.0.1:26380
          - 127.0.0.1:26381
      password: ${REDIS_PASSWORD:123456}
      database: 0
      timeout: 3000ms             # 本地集群涉及拓扑寻址，稍微放宽超时时间
mybatis-plus:
  type-aliases-package: com.ai.study.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl