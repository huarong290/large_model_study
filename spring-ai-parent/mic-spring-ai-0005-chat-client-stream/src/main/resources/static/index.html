<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>流式响应测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 30px;
        }
        h1 {
            font-size: 24px;
            color: #1a1a2e;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }
        .input-group input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            transition: border-color 0.2s;
        }
        .input-group input:focus {
            outline: none;
            border-color: #4f46e5;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #4f46e5;
            color: white;
        }
        .btn-primary:hover {
            background: #4338ca;
        }
        .btn-success {
            background: #10b981;
            color: white;
        }
        .btn-success:hover {
            background: #059669;
        }
        .btn-warning {
            background: #f59e0b;
            color: white;
        }
        .btn-warning:hover {
            background: #d97706;
        }
        .btn-danger {
            background: #ef4444;
            color: white;
        }
        .btn-danger:hover {
            background: #dc2626;
        }
        .btn-outline {
            background: transparent;
            color: #4f46e5;
            border: 2px solid #4f46e5;
        }
        .btn-outline:hover {
            background: #4f46e5;
            color: white;
        }
        .response-area {
            background: #f8fafc;
            border-radius: 12px;
            padding: 20px;
            min-height: 200px;
            max-height: 500px;
            overflow-y: auto;
            font-size: 15px;
            line-height: 1.8;
            white-space: pre-wrap;
            word-wrap: break-word;
            border: 1px solid #e2e8f0;
        }
        .response-area.streaming {
            border-color: #4f46e5;
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.1);
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0 0;
            font-size: 13px;
            color: #888;
        }
        .status-bar .status {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .status-dot.idle {
            background: #94a3b8;
        }
        .status-dot.streaming {
            background: #4f46e5;
            animation: pulse 1s infinite;
        }
        .status-dot.done {
            background: #10b981;
        }
        .status-dot.error {
            background: #ef4444;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .clear-btn {
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 13px;
            padding: 4px 8px;
            border-radius: 4px;
        }
        .clear-btn:hover {
            background: #f1f5f9;
            color: #475569;
        }
        .error-text {
            color: #ef4444;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 16px;
        }
        .stat-item {
            background: #f1f5f9;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }
        .stat-item .label {
            font-size: 12px;
            color: #94a3b8;
        }
        .stat-item .value {
            font-size: 18px;
            font-weight: 600;
            color: #1a1a2e;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🌊 流式响应测试</h1>
    <p class="subtitle">体验 AI 逐字生成的实时效果</p>

    <div class="input-group">
        <input type="text" id="messageInput" placeholder="输入你的消息..." value="写一首关于春天的诗">
        <button class="btn btn-primary" onclick="sendStream()">🚀 流式</button>
        <button class="btn btn-success" onclick="sendSync()">⏳ 同步对比</button>
    </div>

    <div class="btn-group">
        <button class="btn btn-outline" onclick="setMessage('写一首关于春天的诗')">写诗</button>
        <button class="btn btn-outline" onclick="setMessage('讲一个有趣的故事')">讲故事</button>
        <button class="btn btn-outline" onclick="setMessage('用一句话介绍人工智能')">介绍AI</button>
        <button class="btn btn-outline" onclick="setMessage('用英文说你好')">英文</button>
        <button class="btn btn-danger" onclick="clearResponse()">清空</button>
    </div>

    <div class="response-area" id="responseArea">
        <span style="color: #94a3b8;">等待输入...</span>
    </div>

    <div class="status-bar">
        <div class="status">
            <span class="status-dot idle" id="statusDot"></span>
            <span id="statusText">就绪</span>
        </div>
        <div>
            <span id="statsText">字符: 0 | 块: 0</span>
            <button class="clear-btn" onclick="clearResponse()">清空</button>
        </div>
    </div>

    <div class="stats">
        <div class="stat-item">
            <div class="label">字符数</div>
            <div class="value" id="charCount">0</div>
        </div>
        <div class="stat-item">
            <div class="label">数据块</div>
            <div class="value" id="chunkCount">0</div>
        </div>
        <div class="stat-item">
            <div class="label">耗时</div>
            <div class="value" id="timeCount">0ms</div>
        </div>
    </div>
</div>

<script>
    let eventSource = null;
    let charCount = 0;
    let chunkCount = 0;
    let startTime = 0;

    function setMessage(text) {
        document.getElementById('messageInput').value = text;
    }

    function updateStats(charCount, chunkCount, time) {
        document.getElementById('charCount').textContent = charCount;
        document.getElementById('chunkCount').textContent = chunkCount;
        document.getElementById('timeCount').textContent = time + 'ms';
    }

    function setStatus(text, type) {
        document.getElementById('statusText').textContent = text;
        const dot = document.getElementById('statusDot');
        dot.className = 'status-dot ' + type;
    }

    function clearResponse() {
        document.getElementById('responseArea').innerHTML = '';
        charCount = 0;
        chunkCount = 0;
        updateStats(0, 0, 0);
        setStatus('就绪', 'idle');
        document.getElementById('responseArea').classList.remove('streaming');
        if (eventSource) {
            eventSource.close();
            eventSource = null;
        }
    }

    function appendResponse(text, isError = false) {
        const area = document.getElementById('responseArea');
        if (isError) {
            area.innerHTML += '<span class="error-text">❌ ' + text + '</span>';
        } else {
            area.innerHTML += text;
        }
        area.scrollTop = area.scrollHeight;
    }

    function sendStream() {
        const message = document.getElementById('messageInput').value.trim();
        if (!message) {
            alert('请输入消息');
            return;
        }

        // 关闭之前的连接
        if (eventSource) {
            eventSource.close();
            eventSource = null;
        }

        // 重置状态
        clearResponse();
        charCount = 0;
        chunkCount = 0;
        startTime = Date.now();
        setStatus('流式响应中...', 'streaming');
        document.getElementById('responseArea').classList.add('streaming');
        document.getElementById('responseArea').innerHTML = '';

        // 创建 EventSource 连接
        const url = '/api/stream/chat?message=' + encodeURIComponent(message);
        eventSource = new EventSource(url);

        eventSource.onmessage = function(event) {
            if (event.data) {
                chunkCount++;
                charCount += event.data.length;
                appendResponse(event.data);
                updateStats(charCount, chunkCount, Date.now() - startTime);
            }
        };

        eventSource.onerror = function(error) {
            console.error('EventSource error:', error);
            if (eventSource && eventSource.readyState === EventSource.CLOSED) {
                setStatus('已完成', 'done');
                document.getElementById('responseArea').classList.remove('streaming');
                eventSource = null;
                updateStats(charCount, chunkCount, Date.now() - startTime);
            } else {
                setStatus('连接错误', 'error');
                appendResponse('\n\n⚠️ 连接中断，请重试', true);
            }
        };

        // 设置超时（60秒后自动关闭）
        setTimeout(() => {
            if (eventSource && eventSource.readyState !== EventSource.CLOSED) {
                eventSource.close();
                eventSource = null;
                setStatus('超时', 'error');
                document.getElementById('responseArea').classList.remove('streaming');
                appendResponse('\n\n⏰ 响应超时', true);
            }
        }, 60000);
    }

    function sendSync() {
        const message = document.getElementById('messageInput').value.trim();
        if (!message) {
            alert('请输入消息');
            return;
        }

        clearResponse();
        setStatus('同步请求中...', 'streaming');
        document.getElementById('responseArea').innerHTML = '⏳ 等待完整响应...\n\n';

        const startTime = Date.now();

        fetch('/api/stream/sync?message=' + encodeURIComponent(message))
            .then(response => response.json())
            .then(data => {
                const duration = Date.now() - startTime;
                document.getElementById('responseArea').innerHTML = data.response;
                charCount = data.length || data.response.length;
                chunkCount = 1;
                updateStats(charCount, chunkCount, duration);
                setStatus('同步完成', 'done');
                document.getElementById('responseArea').classList.remove('streaming');
            })
            .catch(error => {
                document.getElementById('responseArea').innerHTML = '❌ 请求失败: ' + error.message;
                setStatus('错误', 'error');
                document.getElementById('responseArea').classList.remove('streaming');
            });
    }

    // 回车发送
    document.getElementById('messageInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            sendStream();
        }
    });

    // 页面关闭时关闭连接
    window.addEventListener('beforeunload', function() {
        if (eventSource) {
            eventSource.close();
            eventSource = null;
        }
    });
</script>
</body>
</html>
