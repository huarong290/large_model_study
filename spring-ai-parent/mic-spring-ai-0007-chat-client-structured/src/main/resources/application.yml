server:
  port: 12104                                    # 服务端口配置 ✅
  servlet:
    encoding:
      enabled: true       # 启用请求/响应的字符编码支持 ✅
      force: true         # 强制使用指定编码（覆盖客户端声明的编码） ✅
      charset: UTF-8      # 设置字符编码为 UTF-8 ✅

spring:
  application:
    name: mic-spring-ai-0004-chat-client

  ai:
    openai:
      # 推荐使用环境变量，更安全
      api-key: sk-d9acf81847274fcfb8cbfe0f20051ffd  # 推荐使用环境变量，更安全
      # 如果使用官方 API
      base-url: https://api.deepseek.com
      # 如果使用代理或中转服务，修改为对应地址
      # base-url: https://your-proxy-domain.com/v1
      chat:
        options:
          # 可选的模型：
          # - gpt-4o (最新旗舰)
          # - gpt-4-turbo
          # - gpt-4
          # - gpt-3.5-turbo
          model: deepseek-chat
          # 控制回答的随机性 (0-2)
          temperature: 0.7
          # 可选：控制回答的多样性
          # top-p: 0.9
          # 可选：最大输出 token 数
          # max-tokens: 2048
#    chat:
#        client:
#          enabled: false
