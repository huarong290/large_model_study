server:
  port: 12108                                    # 服务端口配置 ✅
  servlet:
    encoding:
      enabled: true       # 启用请求/响应的字符编码支持 ✅
      force: true         # 强制使用指定编码（覆盖客户端声明的编码） ✅
      charset: UTF-8      # 设置字符编码为 UTF-8 ✅

spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: mic-spring-ai-0008-chat-client-memory
  ai:
    # ================================================================
    # 1. Ollama 本地模型（默认）
    # ================================================================
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen2.5-coder:14b
          temperature: 0.7
          num-predict: 2048
          num-ctx: 4096

    # ================================================================
    # 2. DeepSeek 云端模型
    # ================================================================
    openai:
      api-key: ${DEEPSEEK_API_KEY:not-configured}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
          max-tokens: 2048

# 对话记忆配置
memory:
  # 每个会话保留的最大消息数
  max-messages: 10
  # 会话超时时间（分钟），0 表示永不超时
  timeout-minutes: 30
