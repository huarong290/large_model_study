server:
  port: 12109                                    # 服务端口配置 ✅
  servlet:
    encoding:
      enabled: true       # 启用请求/响应的字符编码支持 ✅
      force: true         # 强制使用指定编码（覆盖客户端声明的编码） ✅
      charset: UTF-8      # 设置字符编码为 UTF-8 ✅
spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: mic-spring-ai-0009-chat-client-rag
  ai:
    # ================================================================
    # 1. Ollama 本地模型（默认）
    # ================================================================
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen2.5-coder:14b
          temperature: 0.7
          num-predict: 2048
          num-ctx: 4096

    # ================================================================
    # 2. DeepSeek 云端模型
    # ================================================================
    openai:
      api-key: ${DEEPSEEK_API_KEY:not-configured}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
          max-tokens: 2048

  # RAG 配置
  rag:
    # 检索时返回的文档数量
    top-k: 3
    # 文档分块大小
    chunk-size: 500
    # 分块重叠大小
    chunk-overlap: 50