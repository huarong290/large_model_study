# ================================================================
# 1. 服务基础配置 (Server)
# ================================================================
server:
  port: 12115
  servlet:
    encoding:
      enabled: true          # 启用请求/响应字符编码支持
      force: true            # 强制覆盖客户端声明的编码
      charset: UTF-8         # 统一使用 UTF-8 编码，防止乱码

# ================================================================
# 2. Spring 核心配置
# ================================================================
spring:
  application:
  config:
    import: "optional:file:.env[.properties]"
    name: mic-spring-ai-0015-chat-client-security  # 微服务/应用名称

  # --------------------------------------------------------------
  # 2.1 缓存抽象配置 (Caching Abstraction)
  # --------------------------------------------------------------
  # 生产级说明：将 type 设为 none，告诉 Spring 不要加载默认的 RedisCacheManager。
  # 完全信任我们在 Java 代码 (MultiLevelCacheConfig) 中手写的
  # CompositeCacheManager (Caffeine L1 + Redis L2 多级组合缓存策略)。
  cache:
    type: none

  # --------------------------------------------------------------
  # 2.2 Redis 高可用配置 (Redis Sentinel 哨兵模式)
  # --------------------------------------------------------------
  data:
    redis:
      timeout: 3000ms        # 连接超时时间，哨兵模式下涉及拓扑寻址，稍调大一点
      password: ${REDIS_PASSWORD:123456}  # 从环境变量读取，读取不到默认为 123456
      database: 0            # 使用 Redis 的第 0 个数据库

      # Redis 哨兵 (Sentinel) 集群拓扑配置
      sentinel:
        master: mymaster     # ⚠️ 必须严格对齐你本地 sentinel.conf 中的集群主节点别名
        nodes:
          - 127.0.0.1:26379
          - 127.0.0.1:26380
          - 127.0.0.1:26381
        password: 123456     # 哨兵节点自身的认证密码（与 Redis 数据节点的密码保持一致即可）

      # Lettuce 连接池配置 (生产级调优参数)
      lettuce:
        pool:
          max-active: 8      # 连接池最大连接数 (使用负数表示不限制)
          max-idle: 8        # 连接池最大空闲连接数
          min-idle: 0        # 连接池最小空闲连接数
          max-wait: -1ms     # 连接池最大阻塞等待时间 (-1 表示无限等待)

  # --------------------------------------------------------------
  # 2.3 全链路可观测性配置 (Micrometer Tracing + Zipkin)
  # --------------------------------------------------------------
  # 生产级说明：在 Spring Boot 3.x 中，Tracing 由 management 前缀接管
  management:
    tracing:
      sampling:
        probability: 1.0    # 采样率：1.0 代表 100% 请求被记录。生产环境如果流量巨大，建议改为 0.1 (10%)
      propagation:
        type: B3            # 使用 B3 协议，兼容微服务间的 HTTP Header 透传
    zipkin:
      tracing:
        # 生产级说明：如果你部署了本地 Zipkin 服务，请解开下面这行：
        # endpoint: http://localhost:9411/api/v2/spans

        # 如果你用外部演示站，请保留下面这行：
        endpoint: https://demo.zipkin.io/api/v2/spans  # ⚠️ 警告：该演示站目前已无法访问

  # --------------------------------------------------------------
  # 2.4 Spring AI 模型配置
  # --------------------------------------------------------------
  ai:
    # 1. Ollama 本地模型配置 (提供低成本、隐私安全的响应)
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.2:3b
          temperature: 0.7
          num-predict: 2048          # 最大生成 token 数
          num-ctx: 8192              # 上下文窗口大小，决定模型能记住多长的对话

    # 2. DeepSeek 云端模型配置 (兼容 OpenAI 协议，适合复杂逻辑)
    openai:
      # 通过环境变量注入 API Key，切勿硬编码在 YAML 文件中
      api-key: ${DEEPSEEK_API_KEY:not-configured}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
          max-tokens: 2048

# ================================================================
# 3. 日志配置 (Logging)
# ================================================================
logging:
  file:
    path: ./logs              # 日志文件存放路径。生产环境建议改为绝对路径，如 /var/log/myapp
  # config: classpath:logback-spring.xml # Spring Boot 默认自动查找，无需显式声明

# ================================================================
# 4.安全配置
# ================================================================
security:
  # API Key 认证
  api-key:
    enabled: true
    header: X-API-Key
    valid-keys:
      - admin-key-123
      - user-key-456
      - test-key-789

  # 限流配置
  rate-limit:
    enabled: true
    max-requests-per-minute: 10
    max-requests-per-day: 100

  # 敏感词过滤
  sensitive-word:
    enabled: true
    # 敏感词列表（实际生产环境应从数据库加载）
    words:
      - 敏感词1
      - 敏感词2
      - 敏感词3
      - 暴力
      - 色情
      - 赌博
      - 毒品

  # 内容审核
  content-audit:
    enabled: true
    # 是否拦截包含敏感词的响应
    block-sensitive-response: true