server:
  port: 18001  # 服务端口
  servlet:
    encoding:
      enabled: true       # 启用编码支持
      force: true         # 强制使用指定编码
      charset: UTF-8      # 字符集编码，大模型对话中文乱码处理

spring:
  application:
    name: spring-ai-01-quick-start
  ai:
    deepseek:
      api-key: sk-d9acf81847274fcfb8cbfe0f20051ffd  # 推荐使用环境变量，更安全
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat      # 指定使用的模型
          temperature: 0.7           # 可选：控制回答的随机性 介于0-2之间，0表示随机性很小，2表示随性很大
